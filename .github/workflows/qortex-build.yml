# Qortex — cross-platform build, packaging, signing & installers (QAM-490/512/507)
#
# Pipeline:
#   1. `studio` — build FenneQ Studio (qamia/fenneq-studio, the bundled sidebar)
#                 into a VSIX so the shell packaging bundles it as a built-in
#                 (build/lib/fenneqStudio.ts). Needs the FENNEQ_STUDIO_TOKEN
#                 secret to read the (private) studio repo.
#   2. `build`  — per-platform: package the app, build native installers, and
#                 code-sign + (mac) notarize WHEN the signing secrets are present.
#                 Without secrets it still produces UNSIGNED installers/archives.
#
# ── SECRETS (add on this repo: Settings → Secrets and variables → Actions) ──
#   FENNEQ_STUDIO_TOKEN         fine-grained PAT, read on qamia/fenneq-studio
#   WINDOWS_CERT_PFX_BASE64     Authenticode cert (.pfx), base64        ┐ Windows
#   WINDOWS_CERT_PASSWORD       .pfx password                           ┘ signing
#   APPLE_CERT_P12_BASE64       Developer ID Application (.p12), base64  ┐
#   APPLE_CERT_PASSWORD         .p12 password                           │ macOS
#   APPLE_API_KEY_P8_BASE64     App Store Connect API key (.p8), base64 │ sign +
#   APPLE_API_KEY_ID            API key id                              │ notarize
#   APPLE_API_ISSUER_ID         API issuer id                           ┘
# All signing/installer/notarization steps below are SCAFFOLDED but UNVERIFIED
# (no runners/certs available at authoring time) — expect to iterate on the first
# real run. Each such step is tagged `# VALIDATE`.

name: Qortex Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        default: "all"
        type: choice
        options:
          - all
          - linux
          - win
          - mac
  # Manual-dispatch only. (Removed the dev-era push triggers on
  # feature/qam-490 + feature/qam-507-ci-signing — they fired stray build
  # runs / failure emails on every push to those branches.)

permissions:
  contents: read

concurrency:
  group: qortex-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Build FenneQ Studio into a VSIX (platform-independent) ──
  studio:
    name: Build FenneQ Studio VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fenneq-studio (main)
        uses: actions/checkout@v4
        with:
          repository: qamia/fenneq-studio
          ref: main
          token: ${{ secrets.FENNEQ_STUDIO_TOKEN }}
          path: studio

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        working-directory: studio
        run: npm ci

      - name: Build + test (types from the schema, extension bundle, webview bundle)
        working-directory: studio
        run: |
          npm run build
          npm test

      - name: Package VSIX
        working-directory: studio
        # --no-dependencies: everything is bundled by esbuild/Vite and the manifest
        # declares no runtime dependencies. --skip-license: private, UNLICENSED.
        run: npx vsce package --no-dependencies --skip-license --out fenneq-studio.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: fenneq-studio-vsix
          path: studio/fenneq-studio.vsix
          if-no-files-found: error
          retention-days: 14

  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Build matrix
        id: pick
        shell: bash
        run: |
          sel="${{ github.event.inputs.platforms || 'all' }}"
          linux='{"os":"ubuntu-latest","label":"linux-x64","gulp":"vscode-linux-x64-min","out":"VSCode-linux-x64","npm_arch":"x64"}'
          # windows-2022 (NOT windows-latest): windows-latest now maps to the
          # windows-2025-vs2026 image, which ships ONLY Visual Studio 2026 —
          # build/npm/preinstall.ts (and node-gyp) require VS 2022/2019, so the
          # toolchain check fails ("Invalid C/C++ Compiler Toolchain", run #6).
          # Revisit when windows-2022 is retired: either install VS2022 BuildTools
          # in a step, or teach preinstall.ts + node-gyp about VS 2026.
          win='{"os":"windows-2022","label":"win32-x64","gulp":"vscode-win32-x64-min","out":"VSCode-win32-x64","npm_arch":"x64"}'
          mac='{"os":"macos-latest","label":"darwin-arm64","gulp":"vscode-darwin-arm64-min","out":"VSCode-darwin-arm64","npm_arch":"arm64"}'
          case "$sel" in
            linux) inc="$linux" ;;
            win)   inc="$win" ;;
            mac)   inc="$mac" ;;
            all|*) inc="$linux,$win,$mac" ;;
          esac
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: [setup, studio]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      npm_config_arch: ${{ matrix.npm_arch }}
      # @vscode/ripgrep (and other postinstalls) download prebuilt binaries via the
      # GitHub API; anonymous requests from shared runner IPs hit the 60/hr rate
      # limit (run #7: darwin died with repeated GETs to microsoft/ripgrep-prebuilt).
      # The workflow token raises this to 5000/hr per run.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Setup Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Materialize the FenneQ Studio VSIX where the gulp build expects it
      # (.build/fenneq-studio.vsix → materializeFenneqStudio → bundled built-in).
      - name: Download FenneQ Studio VSIX
        uses: actions/download-artifact@v4
        with:
          name: fenneq-studio-vsix
          path: .build
      - name: Place VSIX at .build/fenneq-studio.vsix
        shell: bash
        run: test -f .build/fenneq-studio.vsix || mv .build/*.vsix .build/fenneq-studio.vsix

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm

      - name: Windows VS C++ components (ClangCL + Spectre)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $components = @(
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "Microsoft.VisualStudio.Component.VC.Llvm.Clang",
            "Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset"
          )
          $vsArgs = @("modify", "--installPath", "`"$vsPath`"", "--quiet", "--norestart")
          foreach ($c in $components) { $vsArgs += @("--add", $c) }
          Start-Process -FilePath $vsInstaller -ArgumentList $vsArgs -Wait -NoNewWindow
        continue-on-error: true

      - name: Windows node-gyp LTCG workaround
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeDir = Split-Path -Parent (Get-Command node).Source
          $candidates = @(
            (Join-Path $nodeDir 'node_modules\npm\node_modules\node-gyp\addon.gypi'),
            (Join-Path (npm root -g) 'node-gyp\addon.gypi'),
            "$env:APPDATA\npm\node_modules\npm\node_modules\node-gyp\addon.gypi"
          )
          $patched = $false
          foreach ($gyp in $candidates) {
            if (Test-Path $gyp) {
              $content = Get-Content $gyp -Raw
              if ($content -match 'node_with_ltcg=="true_DISABLED_qortex_clangcl"') {
                Write-Host "LTCG block already patched in $gyp"; $patched = $true
              } elseif ($content -match 'node_with_ltcg=="true"') {
                ($content -replace 'node_with_ltcg=="true"', 'node_with_ltcg=="true_DISABLED_qortex_clangcl"') | Set-Content $gyp -NoNewline
                Write-Host "Patched LTCG block in $gyp"; $patched = $true
              }
            }
          }
          if (-not $patched) {
            Write-Error "node-gyp addon.gypi not found; cannot apply LTCG workaround.`n$($candidates -join "`n")"; exit 1
          }

      - name: Install dependencies
        run: npm ci

      # patchWin32DependenciesTask (chained inside vscode-win32-*-min) runs
      # `signtool.exe verify /pa` — a signature CHECK, no cert needed — but
      # signtool lives in the Windows SDK, which isn't on PATH on hosted runners
      # (run #8: "spawn signtool.exe ENOENT" AFTER package-win32-x64 finished).
      # Microsoft's own pipeline prepends the SDK bin dir for exactly this task;
      # glob the newest SDK version rather than hard-coding one.
      - name: Add Windows SDK signtool to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in any Windows SDK under Windows Kits\10\bin" }
          Write-Host "signtool: $($signtool.FullName)"
          Add-Content $env:GITHUB_PATH $signtool.DirectoryName

      - name: Build + package (${{ matrix.gulp }})
        env:
          # A missing studio VSIX is a hard error here: never ship Qortex without its only agent.
          FENNEQ_REQUIRED: "1"
        run: npm run gulp ${{ matrix.gulp }}

      # ── Code-sign the app (only when signing secrets are present) ──
      - name: Sign app — Windows  # VALIDATE
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          # Sign the main exe (a full release would also sign bundled exes/dlls).
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 "..\${{ matrix.out }}\Qortex.exe"

      - name: Sign app — macOS  # VALIDATE
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" "../${{ matrix.out }}/Qortex.app"

      # No Developer ID cert → ad-hoc sign so the app still LAUNCHES on Apple
      # Silicon (unsigned arm64 Electron apps are killed by the OS). Free; not
      # notarized — testers right-click → Open once to clear Gatekeeper. This is
      # the default free path until signing certs are procured (QAM-507).
      - name: Ad-hoc sign app — macOS (no cert)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_BASE64 == ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: codesign --force --deep --sign - "../${{ matrix.out }}/Qortex.app"

      # ── Build native installers ──
      - name: Installer — Windows (Inno Setup)  # VALIDATE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # code.iss [Files] requires tools\* (inno_updater.exe) in the built app
          # dir; the inno-updater task creates it (MS's pipeline runs it right
          # after the min build). Run #10 failed without it: "No files found
          # matching ...VSCode-win32-x64\tools\*".
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup
          # Inno output dir is .build/win32-x64/user-setup — sign the produced setup exe if we have a cert.
          $setup = Get-ChildItem ".build\win32-x64\user-setup\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup -and "${{ secrets.WINDOWS_CERT_PFX_BASE64 }}") {
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
            & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 $setup.FullName
          }
          if ($setup) { Copy-Item $setup.FullName "QortexSetup-${{ matrix.label }}.exe" }

      - name: Installer — Linux (deb + rpm)  # VALIDATE
        if: runner.os == 'Linux'
        run: |
          npm run gulp vscode-linux-x64-build-deb || echo "deb build failed (validate task name/output)"
          npm run gulp vscode-linux-x64-build-rpm || echo "rpm build failed (validate task name/output)"
          # Collect produced packages (paths under .build/linux — validate).
          find .build/linux -name '*.deb' -o -name '*.rpm' 2>/dev/null | while read f; do cp "$f" .; done || true

      - name: Installer + notarize — macOS (DMG)  # VALIDATE
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          npx --yes create-dmg "../${{ matrix.out }}/Qortex.app" . || echo "create-dmg failed (validate)"
          DMG=$(ls *.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/key.p8"
            xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/key.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "$DMG"
            mv "$DMG" "Qortex-${{ matrix.label }}.dmg"
          elif [ -n "$DMG" ]; then
            mv "$DMG" "Qortex-${{ matrix.label }}.dmg"
          fi

      # ── Fallback archive of the raw app bundle (always) ──
      - name: Archive app (non-Windows)
        if: runner.os != 'Windows'
        run: |
          test -d "../${{ matrix.out }}" || { echo "build output ../${{ matrix.out }} not found"; ls -la ..; exit 1; }
          tar -czf "qortex-${{ matrix.label }}.tar.gz" -C .. "${{ matrix.out }}"
      - name: Archive app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "..\${{ matrix.out }}")) { Get-ChildItem ..; throw "build output ..\${{ matrix.out }} not found" }
          Compress-Archive -Path "..\${{ matrix.out }}\*" -DestinationPath "qortex-${{ matrix.label }}.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qortex-${{ matrix.label }}
          path: |
            QortexSetup-${{ matrix.label }}.exe
            Qortex-${{ matrix.label }}.dmg
            *.deb
            *.rpm
            qortex-${{ matrix.label }}.tar.gz
            qortex-${{ matrix.label }}.zip
          if-no-files-found: warn
          retention-days: 14
